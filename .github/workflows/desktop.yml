name: Desktop

# Pull-request check for the Flutter desktop app (desktop/): builds Windows,
# macOS and Linux on their native runners so a change can't silently break a
# desktop build. Desktop targets can only be built on their own OS, so this fans
# out one job per platform.
#
# Releasing desktop binaries is owned by release.yml: on a new version tag it
# rebuilds these same targets and attaches them to the GitHub Release. To avoid
# building desktop twice on a release push, this workflow does NOT run on push
# to main — it's a PR/manual check only.

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: iptvy-windows
            path: desktop/build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact: iptvy-macos
            path: desktop/build/macos/Build/Products/Release
          - os: ubuntu-latest
            target: linux
            artifact: iptvy-linux
            path: desktop/build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev mpv
        working-directory: .

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - run: flutter pub get

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --release

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 7
